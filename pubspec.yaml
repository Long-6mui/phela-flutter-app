name: phela
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  path: ^1.9.1
  sqflite: 2.4.2+1
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/splash/
    - assets/images/banners/
    - assets/images/coffees/
    - assets/images/cakes/
    - assets/images/events/
    - assets/images/news/
    - assets/images/backgrounds/
    - assets/images/quoc anh/hình ảnh phê la/
    - assets/images/quoc anh/hình ảnh phê la/syphon/
    - assets/images/quoc anh/hình ảnh phê la/topping/
    - assets/images/quoc anh/hình ảnh phê la/French Press/
    - assets/images/quoc anh/hình ảnh phê la/moka pot/
    - assets/images/quoc anh/hình ảnh phê la/Cold brew/
    - assets/images/quoc anh/hình ảnh phê la/chai tiện lợi/
    - assets/images/stores/
